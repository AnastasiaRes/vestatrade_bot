<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vesta Trading — демо магазина</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #10202b;
        background: #f4f7fb;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar {
        background: #10202b;
        color: #ffffff;
      }

      .topbar-inner,
      .header-inner,
      .page {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 42px;
        font-size: 13px;
      }

      .topbar-links {
        display: flex;
        gap: 18px;
        color: rgba(255, 255, 255, 0.78);
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid #dce4ee;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
      }

      .header-inner {
        display: grid;
        grid-template-columns: auto minmax(220px, 1fr) auto;
        gap: 20px;
        align-items: center;
        min-height: 84px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        overflow: hidden;
        border-radius: 8px;
        background: #0655d9;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 33% 24%;
        transform: scale(1.55) translateY(6px);
      }

      .brand-name {
        display: grid;
        gap: 2px;
      }

      .brand-name strong {
        font-size: 20px;
        line-height: 1.1;
      }

      .brand-name span {
        color: #6e7b86;
        font-size: 12px;
        font-weight: 700;
      }

      .search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .search input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid #cfd9e6;
        border-radius: 8px;
        background: #ffffff;
        color: #10202b;
      }

      .search button,
      .cart-button,
      .filter-button {
        height: 44px;
        padding: 0 16px;
        border-radius: 8px;
        background: #0655d9;
        color: #ffffff;
        font-weight: 800;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .cart-button {
        background: #eef4ff;
        color: #0655d9;
      }

      .page {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 280px;
        gap: 22px;
        padding: 28px 0 120px;
      }

      .sidebar,
      .summary-panel {
        align-self: start;
        border: 1px solid #dce4ee;
        border-radius: 8px;
        background: #ffffff;
      }

      .sidebar {
        position: sticky;
        top: 104px;
        padding: 14px;
      }

      .sidebar h2,
      .summary-panel h2,
      .catalog-head h1 {
        margin: 0;
      }

      .sidebar h2,
      .summary-panel h2 {
        font-size: 16px;
      }

      .filters {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .filter-button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        background: #f3f6fb;
        color: #344150;
        text-align: left;
      }

      .filter-button.is-active {
        background: #0655d9;
        color: #ffffff;
      }

      .filter-button span {
        color: inherit;
        opacity: 0.72;
        font-size: 12px;
      }

      .catalog {
        min-width: 0;
      }

      .catalog-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .catalog-head h1 {
        font-size: 28px;
        line-height: 1.12;
      }

      .catalog-head p {
        margin: 7px 0 0;
        color: #526078;
      }

      .sort-select {
        min-width: 170px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #cfd9e6;
        border-radius: 8px;
        background: #ffffff;
        color: #344150;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .product-card {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 360px;
        overflow: hidden;
        border: 1px solid #dce4ee;
        border-radius: 8px;
        background: #ffffff;
      }

      /* ``display: grid`` у карточки перебивает ``display: none``, который
         браузер вешает на атрибут ``hidden``: без этого правила скрытая
         карточка осталась бы видимой. */
      .product-card[hidden] {
        display: none;
      }

      .product-media {
        display: grid;
        place-items: center;
        height: 168px;
        padding: 16px;
        border-bottom: 1px solid #edf2f8;
        background: #fbfcff;
      }

      .product-media img {
        max-width: 100%;
        max-height: 136px;
        object-fit: contain;
      }

      .product-body {
        display: grid;
        gap: 10px;
        padding: 16px;
      }

      .product-kicker {
        color: #6e7b86;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .product-media.is-empty::after {
        content: "нет фото";
        color: #97a3b4;
        font-size: 13px;
        font-weight: 700;
      }

      .product-title {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        min-height: 46px;
        margin: 0;
        overflow: hidden;
        color: #10202b;
        font-size: 17px;
        line-height: 1.28;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 8px;
        border-radius: 8px;
        background: #eef4ff;
        color: #0655d9;
        font-size: 12px;
        font-weight: 800;
      }

      .tag.stock {
        background: #eaf8f1;
        color: #128753;
      }

      .tag.out {
        background: #fff0ee;
        color: #b3261e;
      }

      .product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 16px;
        border-top: 1px solid #edf2f8;
      }

      .price {
        font-size: 20px;
        font-weight: 900;
      }

      .product-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 8px;
        background: #0655d9;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
      }

      .summary-panel {
        position: sticky;
        top: 104px;
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      .manager-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border: 1px solid #dce4ee;
        border-radius: 8px;
        background: #f8fbff;
      }

      .manager-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .manager-row img {
        width: 44px;
        height: 44px;
        overflow: hidden;
        border-radius: 50%;
        object-fit: cover;
        object-position: 33% 24%;
        transform: scale(1.05);
      }

      .manager-card p,
      .summary-panel p {
        margin: 0;
        color: #526078;
        font-size: 14px;
        line-height: 1.45;
      }

      .order-box {
        display: grid;
        gap: 10px;
        padding-top: 14px;
        border-top: 1px solid #edf2f8;
      }

      .order-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #526078;
        font-size: 14px;
      }

      .order-line strong {
        color: #10202b;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 32px;
        border: 1px dashed #cfd9e6;
        border-radius: 8px;
        background: #ffffff;
        color: #526078;
        text-align: center;
      }

      @media (max-width: 1080px) {
        .page {
          grid-template-columns: 220px minmax(0, 1fr);
        }

        .summary-panel {
          display: none;
        }
      }

      @media (max-width: 780px) {
        .topbar-inner,
        .header-inner,
        .page {
          width: min(100% - 24px, 680px);
        }

        .topbar-links,
        .header-actions {
          display: none;
        }

        .header-inner {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 12px 0;
        }

        .page {
          grid-template-columns: 1fr;
          padding-top: 18px;
        }

        .sidebar {
          position: static;
        }

        .filters {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .catalog-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .product-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <span>Санкт-Петербург и Москва</span>
        <nav class="topbar-links" aria-label="Сервисное меню">
          <a href="#">Доставка</a>
          <a href="#">Оплата</a>
          <a href="#">Гарантия</a>
          <a href="#">Контакты</a>
        </nav>
      </div>
    </div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#" aria-label="Vesta Trading">
          <span class="brand-mark" aria-hidden="true">
            <img src="/static/vesta_iconka.png" alt="" />
          </span>
          <span class="brand-name">
            <strong>Vesta Trading</strong>
            <span>Инженерная сантехника</span>
          </span>
        </a>

        <form class="search" id="catalogSearch">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Поиск: насос, кран, труба, котёл"
          />
          <button type="submit">Найти</button>
        </form>

        <div class="header-actions">
          <button class="cart-button" type="button">Корзина · 3</button>
        </div>
      </div>
    </header>

    <main class="page">
      <aside class="sidebar" aria-label="Категории">
        <h2>Каталог</h2>
        <div class="filters" id="filters"></div>
      </aside>

      <section class="catalog" aria-label="Товары">
        <div class="catalog-head">
          <div>
            <h1>Каталог магазина</h1>
            <p id="resultCount">Загружаем каталог…</p>
          </div>
          <select class="sort-select" id="sortSelect" aria-label="Сортировка">
            <option value="popular">Сначала популярные</option>
            <option value="priceAsc">Цена по возрастанию</option>
            <option value="stock">В наличии</option>
          </select>
        </div>

        <div class="product-grid" id="productGrid"></div>
      </section>

      <aside class="summary-panel" aria-label="Сводка заказа">
        <h2>Заказ</h2>
        <div class="order-box">
          <div class="order-line">
            <span>Позиций</span>
            <strong>3</strong>
          </div>
          <div class="order-line">
            <span>Сумма</span>
            <strong>39 734 ₽</strong>
          </div>
          <div class="order-line">
            <span>Наличие</span>
            <strong>2 склада</strong>
          </div>
        </div>

        <div class="manager-card">
          <div class="manager-row">
            <img src="/static/vesta_iconka.png" alt="" />
            <div>
              <strong>AI-консультант</strong>
              <p>Подбор по каталогу, ценам и наличию</p>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <script>
      // Витрина собирается из /static/widget-demo-catalog.json — того же фида,
      // на котором работает бот (см. scripts/build_widget_demo_catalog.py).
      // Карточки и счётчики разделов поэтому не могут разойтись с каталогом,
      // по которому консультант отвечает в чате.
      const CATALOG_URL = "/static/widget-demo-catalog.json";

      const grid = document.querySelector("#productGrid");
      const filtersBox = document.querySelector("#filters");
      const resultCount = document.querySelector("#resultCount");
      const searchForm = document.querySelector("#catalogSearch");
      const searchInput = document.querySelector("#searchInput");
      const sortSelect = document.querySelector("#sortSelect");

      let items = [];
      let activeFilter = "all";

      function normalize(value) {
        return String(value || "").toLowerCase().replaceAll("ё", "е");
      }

      function formatPrice(value) {
        if (typeof value !== "number" || Number.isNaN(value)) {
          return "цена по запросу";
        }
        return `${Math.round(value).toLocaleString("ru-RU")} ₽`;
      }

      function createTag(text, modifier) {
        const tag = document.createElement("span");
        tag.className = modifier ? `tag ${modifier}` : "tag";
        tag.textContent = text;
        return tag;
      }

      function createCard(product) {
        const card = document.createElement("article");
        card.className = "product-card";
        card.dataset.sku = product.sku;
        card.dataset.category = product.category;

        const media = document.createElement("div");
        media.className = "product-media";
        if (product.image) {
          const image = document.createElement("img");
          image.loading = "lazy";
          image.src = product.image;
          image.alt = product.name;
          image.addEventListener("error", () => {
            image.remove();
            media.classList.add("is-empty");
          });
          media.appendChild(image);
        } else {
          media.classList.add("is-empty");
        }

        const body = document.createElement("div");
        body.className = "product-body";

        const kicker = document.createElement("span");
        kicker.className = "product-kicker";
        kicker.textContent = [product.sku, product.brand].filter(Boolean).join(" · ");

        const title = document.createElement("h2");
        title.className = "product-title";
        title.textContent = product.name;
        title.title = product.name;

        const meta = document.createElement("div");
        meta.className = "meta-row";
        meta.appendChild(
          product.in_stock
            ? createTag("в наличии", "stock")
            : createTag("нет в наличии", "out"),
        );
        (product.tags || []).forEach((tag) => meta.appendChild(createTag(tag)));

        body.append(kicker, title, meta);

        const footer = document.createElement("div");
        footer.className = "product-footer";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = formatPrice(product.price);

        const link = document.createElement("a");
        link.className = "product-link";
        link.href = product.url || "#";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Открыть";

        footer.append(price, link);
        card.append(media, body, footer);
        return card;
      }

      function renderFilters(catalog) {
        const sections = [
          { id: "all", title: "Все", count: catalog.products.length },
          ...catalog.categories,
        ];
        filtersBox.replaceChildren();
        sections.forEach((section) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className =
            section.id === activeFilter ? "filter-button is-active" : "filter-button";
          button.dataset.filter = section.id;
          button.textContent = section.title;
          const counter = document.createElement("span");
          counter.textContent = String(section.count);
          button.appendChild(counter);
          button.addEventListener("click", () => {
            activeFilter = section.id;
            [...filtersBox.children].forEach((item) =>
              item.classList.toggle("is-active", item.dataset.filter === activeFilter),
            );
            renderCatalog();
          });
          filtersBox.appendChild(button);
        });
      }

      function compare(left, right) {
        if (sortSelect.value === "priceAsc") {
          const leftPrice = typeof left.data.price === "number" ? left.data.price : Infinity;
          const rightPrice = typeof right.data.price === "number" ? right.data.price : Infinity;
          if (leftPrice !== rightPrice) {
            return leftPrice - rightPrice;
          }
        }
        if (sortSelect.value === "stock" && left.data.in_stock !== right.data.in_stock) {
          return left.data.in_stock ? -1 : 1;
        }
        return left.index - right.index;
      }

      function renderCatalog() {
        const query = normalize(searchInput.value).trim();
        const sorted = [...items].sort(compare);

        // В сетку попадают только подходящие карточки.  Прятать лишние
        // атрибутом ``hidden`` нельзя: у ``.product-card`` задан
        // ``display: grid``, и авторский стиль перебивает ``display: none``
        // браузера — отфильтрованные позиции остались бы на экране.
        const fragment = document.createDocumentFragment();
        const visible = sorted.filter((item) => {
          const matchesFilter = activeFilter === "all" || item.data.category === activeFilter;
          const matchesQuery = !query || item.search.includes(query);
          return matchesFilter && matchesQuery;
        });
        visible.forEach((item) => fragment.appendChild(item.node));

        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "Ничего не найдено";
          fragment.appendChild(empty);
        }
        grid.replaceChildren(fragment);

        const inStock = visible.filter((item) => item.data.in_stock).length;
        resultCount.textContent = `Показано ${visible.length} из ${items.length} товаров · в наличии ${inStock}`;
      }

      function showCatalogError() {
        filtersBox.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent =
          "Каталог витрины не загрузился. Соберите его: python3 scripts/build_widget_demo_catalog.py";
        grid.replaceChildren(empty);
        resultCount.textContent = "Каталог недоступен";
      }

      async function loadCatalog() {
        let catalog;
        try {
          const response = await fetch(CATALOG_URL, { cache: "no-cache" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          catalog = await response.json();
        } catch (error) {
          console.error("widget-demo: не удалось загрузить каталог", error);
          showCatalogError();
          return;
        }

        items = (catalog.products || []).map((product, index) => ({
          data: product,
          index,
          node: createCard(product),
          search: normalize(
            [product.name, product.sku, product.brand, product.section].join(" "),
          ),
        }));

        if (!items.length) {
          showCatalogError();
          return;
        }

        renderFilters(catalog);
        renderCatalog();
      }

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        renderCatalog();
      });
      searchInput.addEventListener("input", renderCatalog);
      sortSelect.addEventListener("change", renderCatalog);

      loadCatalog();
    </script>

    <script
      src="/widget-loader.js"
      data-title="AI-консультант"
      data-subtitle="Vesta Trading"
      data-quick="Нужен шаровой кран BASE со стальной рукояткой, 1/2″, ВР/ВР|Позовите консультанта|Как связаться с менеджером?"
    ></script>
  </body>
</html>
